name: Test and build lightweight desktop app

on:
  push:
    branches: [main, master, codex/native-v3-rework]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Build codec without an external Visual C++ runtime
        run: .\native-app\build-codec.ps1
      - name: Build lightweight native application
        run: .\native-app\build.ps1
      - name: Test audio engine, playback and themes
        run: .\native-app\test.ps1 -SkipBuild
      - name: Package, privacy-check and enforce the 20 MiB size limit
        run: .\native-app\package.ps1
      - name: Test final ZIP without development runtimes
        run: .\native-app\smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Splatoon-Audio-Converter-win-x64
          path: |
            native-app/dist/*.zip
            native-app/dist/SHA256SUMS.txt
            native-app/test-output/*.png

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Splatoon-Audio-Converter-win-x64
          path: release
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/dist/*.zip release/dist/SHA256SUMS.txt --title "$RELEASE_TAG" --generate-notes
